name: Android Release APK

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build Flutter Android toolchain
        run: docker compose build flutter-dev

      - name: Configure Android release signing
        env:
          ANDROID_RELEASE_KEY_PROPERTIES: ${{ secrets.ANDROID_RELEASE_KEY_PROPERTIES }}
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_RELEASE_KEY_PROPERTIES}" ] && [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "No Android release signing secrets configured; using the repository's current Android release signing config."
            exit 0
          fi

          if [ -z "${ANDROID_RELEASE_KEY_PROPERTIES}" ] || [ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]; then
            echo "Both ANDROID_RELEASE_KEY_PROPERTIES and ANDROID_RELEASE_KEYSTORE_BASE64 secrets are required for release signing." >&2
            exit 1
          fi

          printf '%s' "${ANDROID_RELEASE_KEY_PROPERTIES}" > android/key.properties
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > android/release-keystore.jks

      - name: Resolve dependencies
        run: docker compose run --rm -T flutter-dev flutter pub get

      - name: Analyze
        run: docker compose run --rm -T flutter-dev flutter analyze

      - name: Test
        run: docker compose run --rm -T flutter-dev flutter test

      - name: Build release APK
        run: docker compose run --rm -T flutter-dev flutter build apk --release

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          safe_tag="${RELEASE_TAG//\//-}"
          asset_name="dekon-${safe_tag}-release.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "${asset_name}"
          gh release upload "${RELEASE_TAG}" "${asset_name}" --clobber
