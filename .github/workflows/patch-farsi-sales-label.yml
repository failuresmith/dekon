name: Patch Farsi sales label

on:
  push:
    branches:
      - fix/farsi-sales-label-clean

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/farsi-sales-label-clean
      - name: Apply focused patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('lib/src/ui/ui_strings.dart')
          text = path.read_text()
          old = "String get revenue => _text(en: 'Sales Amount', fa: 'مبلغ فروش');"
          new = "String get revenue => _text(en: 'Sales Amount', fa: 'فروش');"
          if old not in text:
              raise SystemExit('Could not find current Farsi sales label')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate focused patch
        run: |
          grep -q "Sales Amount" lib/src/ui/ui_strings.dart
          grep -q "فروش" lib/src/ui/ui_strings.dart
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-farsi-sales-label.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/ui/ui_strings.dart .github/workflows/patch-farsi-sales-label.yml
          git commit -m "Use فروش as Farsi sales label"
          git push origin HEAD:fix/farsi-sales-label-clean
