name: Patch sale summary total quantity

on:
  push:
    branches:
      - fix/sale-summary-total-quantity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sale-summary-total-quantity
      - name: Apply focused patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/src/ui/transaction_screen.dart')
          text = path.read_text()

          getter_anchor = """  int get _totalMinor => _lines.fold(
              0,
              (sum, line) =>
                  sum + (_isSell ? line.saleTotalMinor : line.purchaseTotalMinor),
            );
          """
          getter_replacement = getter_anchor + """  double get _totalQuantity =>
              _lines.fold(0, (sum, line) => sum + line.quantity);
          """

          summary_anchor = """                    context.strings.itemsCount(_lines.length),
          """
          summary_replacement = """                    '${context.strings.itemsCount(_lines.length)} '
                        '(${context.strings.quantity(_totalQuantity)})',
          """

          if '_totalQuantity' not in text:
              if getter_anchor not in text:
                  raise SystemExit('Could not find total getter anchor')
              text = text.replace(getter_anchor, getter_replacement, 1)

          if summary_anchor in text:
              text = text.replace(summary_anchor, summary_replacement, 1)
          elif "context.strings.quantity(_totalQuantity)" not in text:
              raise SystemExit('Could not find summary anchor')

          path.write_text(text)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-sale-summary-total-quantity.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/ui/transaction_screen.dart .github/workflows/patch-sale-summary-total-quantity.yml
          git commit -m "Fix sale summary total quantity display"
          git push origin HEAD:fix/sale-summary-total-quantity
