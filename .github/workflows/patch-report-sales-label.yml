name: Patch report sales label

on:
  push:
    branches:
      - fix/report-sales-amount-label

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/report-sales-amount-label
      - name: Apply focused patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('lib/src/ui/ui_strings.dart')
          text = path.read_text()
          old = "String get revenue => _text(en: 'Revenue', fa: 'درآمد');"
          new = "String get revenue => _text(en: 'Sales Amount', fa: 'مبلغ فروش');"
          if old not in text:
              raise SystemExit('Could not find revenue label anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate focused patch
        run: grep -q "Sales Amount" lib/src/ui/ui_strings.dart
      - name: Remove temporary workflow
        run: rm .github/workflows/patch-report-sales-label.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/ui/ui_strings.dart .github/workflows/patch-report-sales-label.yml
          git commit -m "Rename Revenue report metric to Sales Amount"
          git push origin HEAD:fix/report-sales-amount-label
